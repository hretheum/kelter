[package]
name = "mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "MCP tool substrate, capability registry and reference tool servers for the Kelter agent runtime."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tools-server"
path = "src/bin/tools_server.rs"

[[bin]]
name = "ledger-server"
path = "src/bin/ledger_server.rs"

[[bin]]
name = "code-server"
path = "src/bin/code_server.rs"

[[bin]]
name = "memory-server"
path = "src/bin/memory_server.rs"

[dependencies]
kernel-core.workspace = true
memory.workspace = true
storage.workspace = true
jsonschema.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
uuid.workspace = true
anyhow.workspace = true
toml.workspace = true
rmcp = { version = "2.2", features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-io",
    "transport-child-process",
    "transport-async-rw",
] }
schemars = "1"

[dev-dependencies]
# ADR 0040: the shared episode-context probe.
kernel-core = { workspace = true, features = ["testkit"] }
