[package]
name = "model-config"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Runtime-mutable model configuration (ADR 0015). Extracted from the daemon so
# BOTH the daemon and the desktop standalone topology can build the controller
# and serve the /api/v1/config/model* surface (the daemon crate is bin-only, so
# its module could not be imported).
[lib]
name = "model_config"

[dependencies]
api.workspace = true
policy.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
reqwest.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync"] }
