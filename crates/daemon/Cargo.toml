[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The kelter daemon: assembles the Kelter agent runtime and serves its API and web UI."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "kelter"
path = "src/main.rs"

[features]
# Opt-in shared Postgres+pgvector memory backend (ADR 0028). Off by default:
# a normal `cargo build`/`cargo build -p daemon` never compiles the Postgres
# driver. Enable with `--features postgres`.
postgres = ["dep:pgstore"]

[dependencies]
kernel-core.workspace = true
policy.workspace = true
model-config.workspace = true
skills.workspace = true
mcp.workspace = true
memory.workspace = true
api.workspace = true
storage.workspace = true
a2a.workspace = true
wasmhost.workspace = true
# Shared Postgres memory backend (ADR 0028) — OPT-IN behind the `postgres`
# feature, so default builds never pull the Postgres driver.
pgstore = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
uuid.workspace = true
reqwest.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
opentelemetry = { version = "0.32", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics", "logs"] }
# Blocking reqwest client: the metrics PeriodicReader and the batch span/log
# processors run on their own OS threads (no tokio reactor), so the exporter
# must not require an async runtime — a blocking client works from any thread.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
