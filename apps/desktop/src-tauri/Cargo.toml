[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Deliberately outside the root workspace (excluded there): building the
# desktop shell needs the platform webview toolchain, which `cargo build
# --workspace` should not require.
[workspace]

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rand = "0.9"
tracing = "0.1"
kernel-core = { path = "../../../crates/kernel-core" }
policy = { path = "../../../crates/policy" }
mcp = { path = "../../../crates/mcp" }
memory = { path = "../../../crates/memory" }
api = { path = "../../../crates/api" }
