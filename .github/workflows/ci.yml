name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # The pgstore integration tests (ADR 0028) need a real Postgres+pgvector.
    # Without this they are #[ignore]d and the shared-memory backend is never
    # exercised in CI — which is exactly what happened between ADR 0028 and
    # 2026-08-03. The schema migration issues its own CREATE EXTENSION, so the
    # image is all that is required here.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kelter
          POSTGRES_PASSWORD: kelter
          POSTGRES_DB: kelter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kelter -d kelter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Build the web-ui first: crates/api embeds apps/web-ui/dist via
      # RustEmbed at compile time (design/07 D-7 — dist/ is gitignored).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web-ui
      # The vitest suite ran nowhere in CI until 2026-08-03: `pnpm build` only
      # type-checks and bundles, it never executes a test. Kept ahead of the
      # build so a failing test fails fast, before the Rust toolchain is even
      # installed. The `desktop` job deliberately does NOT repeat this — it
      # builds the web-ui only because crates/api embeds dist/, and the suite is
      # platform-independent, so running it once here is enough.
      - run: pnpm test
        working-directory: apps/web-ui
      - run: pnpm build
        working-directory: apps/web-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # clippy 1.99 (double_must_use) flaguje kod generowany przez #[async_trait] — to nie nasz kod.
      - run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::double_must_use
      # --include-ignored so the pgstore tests above actually run. There are no
      # other #[ignore]d tests in the workspace, so this widens nothing else.
      - run: cargo test --workspace -- --include-ignored
        env:
          KELTER_TEST_POSTGRES_URL: postgres://kelter:kelter@localhost:5432/kelter_test

  container:
    name: container image (amd64)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      # NO setup-qemu here, deliberately. This job only answers "does the
      # Dockerfile still build", and amd64 answers it. Cross-building arm64
      # on an amd64 runner means QEMU emulation, and a Rust build of ~415
      # crates (wasmtime + cranelift among them) under emulation took 40+
      # minutes per push. Multi-arch stays in publish-image.yml, behind an
      # explicit input — which already defaults arm64 off for exactly this
      # reason. K12 is amd64 anyway.
      - uses: docker/setup-buildx-action@v3
      # Build only — no registry push. Publishing is a human decision.
      # mode=min, not max: publish-image.yml uses mode=max and both jobs share
      # one 10 GB per-repo GHA cache. Exporting every intermediate layer from
      # here too would evict the publish cache, which is the one that matters.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: kelter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

  desktop:
    name: desktop shell (lint + test + build)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: check
    steps:
      - uses: actions/checkout@v4
      # The desktop shell links crates/api → needs the built web-ui too.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: apps/web-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux webview deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      # apps/desktop/src-tauri is EXCLUDED from the root workspace, so the
      # check job's fmt/clippy/test never touch it. Without the three steps
      # below, this crate's only coverage is `cargo tauri build`, which
      # compiles the lib and NOT the test targets — that is exactly how
      # tests/durable_store.rs drifted out of sync with `Run` unnoticed
      # (see BUILD-EVIDENCE 2026-08-03). Lint runs once on ubuntu (it is
      # platform-independent); tests run on both legs.
      - name: fmt + clippy (ubuntu leg only — platform-independent)
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings -A clippy::double_must_use
      - name: Test the desktop crate
        working-directory: apps/desktop/src-tauri
        run: cargo test --all-targets
      - run: cargo install tauri-cli --version '^2' --locked
      - name: Build (no bundle, no signing — build only)
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --no-bundle
