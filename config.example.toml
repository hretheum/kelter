# kelter daemon configuration.
# Copy to config.toml and adjust. The policy engine is ONE line:
# swap it and the same task runs on a different model class.

[server]
bind = "127.0.0.1:7466"
# token = "set-a-long-random-token"   # omitted → generated and printed at startup

[policy]
engine = "local:qwen2.5-0.5b-instruct"
# engine = "openrouter:anthropic/claude-sonnet-5"   # ← the one-line swap (key from OPENROUTER_API_KEY env)
# engine = "local-native:gpt-oss-20b" # llama.cpp with native `tools` instead of GBNF (C1)
# base_url = "http://127.0.0.1:8080"  # llama.cpp server (default shown)
# latitude = "constrained"            # constrained | standard | wide (default derives from adapter)
#   NOTE for iterative (coding) loops: "constrained" REMOVES a once-succeeded tool from the
#   action space and duplicate proposals are rejected outside "wide" — use "standard".
# max_tokens = 2048          # B2: completion budget per proposal (default 512 local / 1024 native)
# thinking = false           # B1: disable thinking mode (REQUIRED for Qwen under GBNF)
# step_result_limit = 1500   # B3: per-step result truncation in the prompt (default 600)

[storage]
backend = "sqlite"     # "sqlite" (durable — runs/journal/memory survive restarts) | "memory"
path = "./kelter.db"

# Store retention (ADR 0017): bound growth by pruning TERMINAL runs only —
# never an in-flight run. Defaults shown; run once on start + `kelter prune`.
# [retention]
# prune_on_start = true
# max_runs = 10000        # keep at most this many terminal runs (0 = unlimited)
# max_age_days = 30       # optional: also prune terminal runs older than N days

# Security surface (ADR 0018). All optional/additive — the default single-token
# flow is unchanged. Secrets stay in env / gitignored files, never here.
# [auth]
# test_allowlist = ["http://127.0.0.1:9000"]   # extra health-check probe origins
# [[auth.principals]]                            # named tokens → per-run attribution
# name = "alice"
# token_env = "KELTER_TOKEN_ALICE"               # token value lives in the env, not here
# [tls]                                          # opt-in HTTPS (rustls); default = plain
# cert = "/etc/kelter/cert.pem"                  # PEM cert (gitignored, never committed)
# key  = "/etc/kelter/key.pem"                   # PEM private key (gitignored)

# [otel]
# endpoint = "http://127.0.0.1:4318"   # OTLP/HTTP; absent = tracing export off
# service_name = "kelter"

[kernel]
max_steps = 12
reflection = true    # gate for the provenance-tagged reflection stub
mode = "step"        # "step" (one action at a time) | "plan" (validated durable DAG, ADR 0010)
# Plan-mode resilience (ADR 0030) — both default 0 (= a failed node fails the run):
# plan_node_retries = 1   # extra attempts per failed tool/a2a node (transient failures)
# plan_replans = 2        # max REVISED plans after a failure (re-validated, journaled, bounded)

[tools]
workspace = "./work" # reference MCP tools read/write inside this directory
# Directories scanned for extensions (subdirs with a kelter-extension.toml
# manifest). Extensions register at startup — no recompilation.
extension_dirs = ["./extensions"]
# Additional MCP servers (stdio). Default: the bundled reference tool server.
# [[tools.servers]]
# name = "my-tools"
# command = "/path/to/mcp-server"
# args = ["--flag"]

# Agentic-coding tool surface (opt-in; A1/C4/C5). SECURITY: gives the model allowlisted
# command execution inside `root` with the daemon's FULL OS authority — point it only at a
# disposable checkout/fixture. Reads+writes+cwd are confined to `root` (symlink-safe).
# [tools.coding]
# root = "/path/to/disposable/checkout"
# merged_roles = false        # false (default) = A1 separated roles: the planner's only route
#                             # to changing code is popraw_kod(sciezka, instrukcja); true =
#                             # zastosuj_patch directly (the measured-worse baseline)
# executor_url = ""           # popraw_kod's executor model; default = [policy] base_url
# executor_max_tokens = 2048
# allow = ["cargo", "git"]    # commands the model may run via uruchom_komende
# timeout_secs = 180
# summary_errors = 5          # C5: error blocks kept in the tool-side summary
