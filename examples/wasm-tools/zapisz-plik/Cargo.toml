[package]
name = "zapisz-plik"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate (its own workspace) so `cargo build --workspace` in the
# repo root never tries to build it with the host toolchain. Build with:
#   cargo build --release --target wasm32-unknown-unknown
# Host-side unit tests of the guest's own checks: `cargo test`.
[workspace]

[dependencies]
serde_json = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
