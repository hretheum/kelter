[package]
name = "netpeek-wasm"
version = "0.1.0"
edition = "2021"
publish = false

# A sandbox-probe module: it IMPORTS a host "network" capability. The Kelter
# WASM host only links that import when the manifest grants `network`, so
# without the grant the module cannot be instantiated — the capability is
# structurally absent. Build with:
#   cargo build --release --target wasm32-unknown-unknown
[workspace]

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
