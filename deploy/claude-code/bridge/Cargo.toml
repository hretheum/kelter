[package]
name = "claude-code-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "stdio MCP server that forwards tool calls to the Claude Code runner over HTTP (deploy/claude-code)"

# Standalone crate (its own workspace): it ships as a static binary inside
# the `claude-code` extension directory, not as part of the daemon. Build the
# K12 binary with deploy/claude-code/build-bridge.sh; test with `cargo test`.
[workspace]

[dependencies]
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
