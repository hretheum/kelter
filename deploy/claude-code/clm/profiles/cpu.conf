# CLM profile C: the encoder on the CPU; the GPU stays with the local
# orchestrator (on K12: gemma-3-27b via llama-swap). Seconds per answer —
# enough for shadow mode, one question per task. Needs AVX-512 for speed.
# Copy to ~/.config/containers/systemd/clm.container.d/10-profile.conf
[Container]
Image=localhost/clm:cpu
Environment=CLM_DEVICE=cpu
# vLLM CPU: KV cache in GiB (states are short) and the threads it may use.
Environment=VLLM_CPU_KVCACHE_SPACE=1
Environment=VLLM_CPU_OMP_THREADS_BIND=auto
# KRW.2b: the fine-tuned head for the path question (reference head if unset).
Environment=CLM_CKPT=/cache/heads/path-v1.pt
# Measured on K12 (2026-10-13): ~28 GB resident with a 4 GiB KV cache;
# 1 GiB is plenty for one short question at a time (the KRW.2b training ran
# inside 24 GB with it). CLM is also the first thing the OOM killer takes
# (clm.container: --oom-score-adj=1000).
Memory=26G
