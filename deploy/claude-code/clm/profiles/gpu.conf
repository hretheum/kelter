# CLM profile A/B: the encoder on the GPU.
#   A — the GPU is CLM's alone; Kelter's [policy] engine is non-local
#       (OpenRouter, Anthropic, another gateway — KR5.1a).
#   B — a GPU big enough for CLM and the local orchestrator together;
#       lower CLM_GPU_UTIL until both fit.
# Copy to ~/.config/containers/systemd/clm.container.d/10-profile.conf
[Container]
Image=localhost/clm:gpu
AddDevice=nvidia.com/gpu=all
Environment=CLM_DEVICE=cuda
# Profile A: most of the card. Profile B: e.g. 0.30–0.40 on a 48 GB card.
Environment=CLM_GPU_UTIL=0.65
Memory=24G
