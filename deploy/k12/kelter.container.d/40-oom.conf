# K12: Kelter is protected under memory pressure — the kernel OOM killer
# picks it after the expendable services (claude-code-runner 800, clm 1000,
# hretheum-embeddings 700; containers default to 200). PodmanArgs= is a
# list key, so this adds to the canonical unit. Set 2026-10-13 with zram
# (deploy/k12/README.md, "Memory").
# Unprivileged processes can only RAISE oom_score_adj: under the user
# manager a service starts at 200, so --oom-score-adj=100 alone is ignored
# (seen after the 2026-10-13 reboot). OOMScoreAdjust= sets it on the unit,
# before podman runs; PodmanArgs keeps the container's own value in line.
[Container]
PodmanArgs=--oom-score-adj=100

[Service]
OOMScoreAdjust=100
