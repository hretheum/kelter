# Extension manifest — the runtime discovers this file, checks the declared
# capabilities, and runs the server as an ordinary MCP tool server.
# Everything the tool does still passes kernel-side validation.

[extension]
name = "wordstats"
description = "Word statistics tool in ~25 lines of Python (example extension)"
provides = ["tools"]
# Runs as a local subprocess (MCP) — not sandboxed. Explicit trust opt-in
# (ADR 0012); the operator must also allow it in the daemon config.
trust = "subprocess-unsandboxed"

[permissions]
workspace_write = true

[server]
command = "./run.sh"
